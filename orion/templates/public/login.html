{% extends "base_public.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="container narrow" style="padding:56px 24px">
  <div class="card">
    <h1 style="font-size:1.35rem;margin-bottom:6px">Connexion</h1>
    <p class="muted small mb3">Accédez à vos instances et à vos factures.</p>

    {% if error %}<div class="alert err mb2">{{ error }}</div>{% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_url or '/app' }}">
      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input class="input" type="email" id="email" name="email" value="{{ email or '' }}"
               autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input class="input" type="password" id="password" name="password"
               autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">Se connecter</button>

      {% if turnstile_site_key %}
      <div class="cf-turnstile mt3" data-sitekey="{{ turnstile_site_key }}"
           data-theme="dark" data-language="fr"></div>
      <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
      {% endif %}
    </form>

    <p class="small muted mt3">
      Pas encore de compte ? <a href="/register">Créer un compte</a>
    </p>
  </div>
</div>
{% endblock %}
